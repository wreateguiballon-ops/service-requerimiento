# Server Port
server.port=8081

# Spring Application Name
spring.application.name=servicio-seguridad

spring.datasource.url=jdbc:sqlserver://webiisdes01:1433;databaseName=GestionRQ;integratedSecurity=true;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

#==================================================
# JSON
#==================================================
spring.jackson.default-property-inclusion=non_null

#==================================================
# JWT Config
#==================================================
app.jwt.secret = ${JWT_SECRET}
app.jwt.expiration = 600000
#600000 == 10 minutos en milisegundos
logging.level.org.springframework.security=DEBUG